<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心版 · 老师后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6efe2; --card:#fffdf8; --ink:#3b2f22; --muted:#7a6650; --line:rgba(150,105,45,.18);
  --gold:#d6974a; --goldDeep:#a8692a; --goldSoft:#f6e3c3; --green:#3c9a62; --red:#c4553a; --blue:#4f72a6;
  --f-head:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);padding:16px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:320px;z-index:-1;background:url("assets/home_l.webp") center 70%/cover no-repeat;-webkit-mask:linear-gradient(#000 0%,transparent 100%);mask:linear-gradient(#000 0%,transparent 100%);opacity:.55}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-head);font-weight:900;margin:0;letter-spacing:.04em}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(214,151,74,.5);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;color:#8a4a1c}
.brand span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 0 #fff inset,0 14px 30px -20px rgba(120,80,30,.45)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#eab468,#c4823a);box-shadow:0 3px 0 #8a5520,inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5520}
.btn:disabled{opacity:.5}
.btn.ghost{color:#6b4a1f;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px -3px rgba(120,80,30,.35)}
.btn.danger{background:linear-gradient(180deg,#e07a5c,#b84a30);box-shadow:0 3px 0 #7d2e18}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:160px;resize:vertical;line-height:1.7}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#6b4a1f}
.msg{margin:0;font-size:14px;min-height:1.3em}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 登录 */
.login{max-width:420px;margin:40px auto 0;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:22px;text-align:center}
.tabs{display:flex;gap:6px;background:#efe5d3;padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 6px -3px rgba(120,80,30,.4)}
/* 班级栏 */
.classbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.classbar select{width:auto;min-width:180px;font-weight:700}
/* 汇总 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-head);font-size:28px;color:var(--goldDeep);font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
/* 一览表 */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:720px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
th .arr{opacity:.6;margin-left:2px}
td{padding:10px;border-bottom:1px solid rgba(150,105,45,.1);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td{background:#fff7e8}
.who b{font-weight:700}.who small{display:block;color:var(--muted);font-size:12px}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:8px;border-radius:4px;background:#efe5d3;width:90px;overflow:hidden;flex-shrink:0}
.bar i em{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#eab468,#c4823a)}
.bar.green i em{background:linear-gradient(90deg,#7cc99a,#3c9a62)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.on{background:#e3f4e9;color:#2e7d4f}.pill.mid{background:#fff1d6;color:#9a6418}.pill.off{background:#f6e3dc;color:#a8452c}.pill.none{background:#eee8de;color:#8a7d6b}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
/* 学生详情 */
.detail{display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dhead h3{font-size:22px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart h4{margin:0 0 8px;font-size:14px;color:#6b4a1f}
.chart svg{width:100%;height:auto;display:block}
.books{display:flex;flex-direction:column;gap:12px}
.book h4{margin:0 0 6px;font-size:14px}
.book h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{font-size:11px;line-height:1;padding:6px 7px;border-radius:7px;background:#eee8de;color:#8a7d6b;position:relative}
.cell.s1{background:#f8e2b8;color:#7a4a1c}.cell.s2{background:#efbf6b;color:#5a3300}.cell.s3{background:#d58d2c;color:#fff}
.cell.adv::after{content:"默";position:absolute;top:-6px;right:-5px;font-size:9px;background:#4f5f8c;color:#fff;border-radius:6px;padding:1px 3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* 账号 */
.acct{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.acct{grid-template-columns:1fr}}
.newlist table{min-width:0}
.newlist td,.newlist th{font-size:15px}
.pw{font-family:ui-monospace,Menlo,monospace;font-size:16px;letter-spacing:.1em;font-weight:700}
.danger-q{color:var(--red);font-size:13px}
@media print{body.printing .card:not(#newList),body.printing #tiles,body.printing .msg{display:none!important}.printonly{display:block!important}body{background:#fff;padding:0}body::before,.noprint{display:none!important}.card{box-shadow:none;border:0}.newlist td,.newlist th{font-size:16px;padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top noprint">
    <div class="brand"><h1>心版</h1><span>老师后台</span></div>
    <div class="row"><a class="btn ghost small" href="./" style="text-decoration:none">回到游戏</a><span class="hint" id="me"></span><button class="btn ghost small" id="logout" hidden>退出登录</button></div>
  </div>

  <!-- 登录 / 注册 -->
  <section class="card login" id="loginBox" hidden>
    <h2>老师登录</h2>
    <div class="tabs" role="group" aria-label="登录或注册"><button id="tLogin" aria-pressed="true">登录</button><button id="tSign" aria-pressed="false">注册老师账号</button></div>
    <form id="authForm" class="login" style="margin:0" novalidate>
      <label for="email">邮箱<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label for="pass">密码<input id="pass" type="password" autocomplete="current-password" placeholder="至少 6 位"></label>
      <p class="msg" id="authMsg" role="alert"></p>
      <button class="btn" id="authGo" type="submit">登录</button>
    </form>
    <p class="hint" style="text-align:center">学生不在这里登录。学生账号由你在后台生成，学生在游戏首页登录。</p>
  </section>

  <!-- 主界面 -->
  <section id="app" hidden>
    <div class="wrap">
      <div class="card classbar noprint">
        <label for="classSel" style="flex-direction:row;align-items:center;gap:8px">班级<select id="classSel"></select></label>
        <div class="tabs" role="group" aria-label="页面" style="flex:0 0 auto"><button id="vStats" aria-pressed="true">学习情况</button><button id="vAcct" aria-pressed="false">学生账号</button></div>
        <span style="flex:1"></span>
        <form id="newClass" class="row" style="flex-wrap:nowrap"><input id="newClassName" placeholder="新班级名称，例如 初二一班" maxlength="40" style="width:200px"><button class="btn small" type="submit">新建班级</button></form>
      </div>
      <p class="msg err" id="appMsg"></p>

      <div id="noClass" class="card empty" hidden>还没有班级。在上面输入班级名称，点“新建班级”。</div>

      <!-- 学习情况 -->
      <div id="statsView" class="wrap" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <h2 style="font-size:20px">全班一览</h2>
            <span class="hint">点一行查看这个学生的详细情况　·　时长按雅加达时间计算</span>
          </div>
          <div class="tablewrap"><table id="tbl"></table></div>
        </div>
        <div class="card detail" id="detail" hidden></div>
      </div>

      <!-- 学生账号 -->
      <div id="acctView" hidden>
        <div class="acct">
          <div class="card" style="display:flex;flex-direction:column;gap:12px">
            <h2 style="font-size:20px">添加学生</h2>
            <p class="hint">每行写一个学生的名字，系统会自动生成账号和 6 位数字密码。</p>
            <textarea id="names" placeholder="林小雨&#10;王约翰&#10;陈路加"></textarea>
            <div class="row"><button class="btn" id="addGo">生成账号</button><span class="msg" id="addMsg"></span></div>
          </div>
          <div class="card newlist" id="newList" hidden>
            <div class="row noprint" style="justify-content:space-between">
              <h2 style="font-size:20px">新账号名单</h2>
              <div class="row"><button class="btn ghost small" id="copyNew">复制全部</button><button class="btn ghost small" id="printNew">打印</button></div>
            </div>
            <p class="hint noprint" style="color:var(--red)">密码只在这里显示这一次，请现在复制或打印发给学生。忘了可以在下方“重置密码”。</p>
            <h2 style="font-size:20px;display:none" class="printonly">心版 · 学生账号</h2>
            <table id="newTbl"></table>
          </div>
        </div>
        <div class="card" style="margin-top:16px">
          <h2 style="font-size:20px;margin-bottom:8px">全部学生</h2>
          <div class="tablewrap"><table id="acctTbl"></table></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient("https://ndaliuqndcongzdaekgu.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYWxpdXFuZGNvbmd6ZGFla2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3OTg5MDIsImV4cCI6MjEwOTM3NDkwMn0.W6gYi-pRe7bM5adLl0YpwtqJq9lSQ0OnextINsOGrr8");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BOOKS={"创":"创世记","出":"出埃及记","利":"利未记","民":"民数记","申":"申命记","书":"约书亚记","士":"士师记","得":"路得记","撒上":"撒母耳记上","撒下":"撒母耳记下","王上":"列王纪上","王下":"列王纪下","代上":"历代志上","代下":"历代志下","拉":"以斯拉记","尼":"尼希米记","斯":"以斯帖记","伯":"约伯记","诗":"诗篇","箴":"箴言","传":"传道书","歌":"雅歌","赛":"以赛亚书","耶":"耶利米书","哀":"耶利米哀歌","结":"以西结书","但":"但以理书","何":"何西阿书","珥":"约珥书","摩":"阿摩司书","俄":"俄巴底亚书","拿":"约拿书","弥":"弥迦书","鸿":"那鸿书","哈":"哈巴谷书","番":"西番雅书","该":"哈该书","亚":"撒迦利亚书","玛":"玛拉基书","太":"马太福音","可":"马可福音","路":"路加福音","约":"约翰福音","徒":"使徒行传","罗":"罗马书","林前":"哥林多前书","林后":"哥林多后书","加":"加拉太书","弗":"以弗所书","腓":"腓立比书","西":"歌罗西书","帖前":"帖撒罗尼迦前书","帖后":"帖撒罗尼迦后书","提前":"提摩太前书","提后":"提摩太后书","多":"提多书","门":"腓利门书","来":"希伯来书","雅":"雅各书","彼前":"彼得前书","彼后":"彼得后书","约壹":"约翰一书","约贰":"约翰二书","约叁":"约翰三书","犹":"犹大书","启":"启示录"};
const BORDER=Object.keys(BOOKS);
let CLASSES=[],CID=null,ROWS=[],SORT={k:"username",d:1},signMode=false;

/* ---------- 文字格式 ---------- */
function dur(sec){sec=sec||0;if(sec<60)return sec?"不到 1 分钟":"0";const m=Math.round(sec/60);if(m<60)return m+" 分钟";const h=Math.floor(m/60),r=m%60;return h+" 小时"+(r?" "+r+" 分":"")}
function ago(t){if(!t)return "从未登录";const s=(Date.now()-new Date(t))/1000;if(s<120)return "刚刚";if(s<3600)return Math.round(s/60)+" 分钟前";if(s<86400)return Math.round(s/3600)+" 小时前";const d=Math.round(s/86400);return d<30?d+" 天前":new Date(t).toLocaleDateString("zh-CN")}
function activity(r){if(!r.last_seen)return '<span class="pill none">未登录过</span>';const days=(Date.now()-new Date(r.last_seen))/864e5;
  if(r.today_sec>0)return '<span class="pill on">今天练过</span>';if(days<3)return '<span class="pill mid">'+ago(r.last_seen)+'</span>';return '<span class="pill off">'+ago(r.last_seen)+'</span>'}
const errText=e=>{const m=(e&&e.message)||"";if(/Invalid login/i.test(m))return "邮箱或密码不对。";if(/Email not confirmed/i.test(m))return "邮箱还没确认，请先到邮箱点确认链接。";if(/already registered/i.test(m))return "这个邮箱已经注册过，请直接登录。";if(/Password should be/i.test(m))return "密码至少 6 位。";if(/NOT_YOUR_CLASS/.test(m))return "没有权限操作这个班级。";return "出错了："+m};

/* ---------- 登录 ---------- */
function setMode(sign){signMode=sign;$("#tLogin").setAttribute("aria-pressed",!sign);$("#tSign").setAttribute("aria-pressed",sign);$("#authGo").textContent=sign?"注册":"登录";$("#pass").autocomplete=sign?"new-password":"current-password";$("#authMsg").textContent=""}
$("#tLogin").onclick=()=>setMode(false);$("#tSign").onclick=()=>setMode(true);
$("#authForm").onsubmit=async e=>{e.preventDefault();const email=$("#email").value.trim(),password=$("#pass").value,m=$("#authMsg");m.className="msg";
  if(!email||password.length<6){m.className="msg err";m.textContent="请输入邮箱和至少 6 位的密码。";return}
  $("#authGo").disabled=true;
  if(signMode){const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}});
    if(error){m.className="msg err";m.textContent=errText(error)}
    else if(!data.session){m.className="msg ok";m.textContent="注册成功！请到邮箱点确认链接，然后回来登录。"}
  }else{const {error}=await SB.auth.signInWithPassword({email,password});if(error){m.className="msg err";m.textContent=errText(error)}}
  $("#authGo").disabled=false};
$("#logout").onclick=async()=>{await SB.auth.signOut()};
SB.auth.onAuthStateChange((ev,session)=>{const on=!!session;$("#loginBox").hidden=on;$("#app").hidden=!on;$("#logout").hidden=!on;$("#me").textContent=on?session.user.email:"";if(on)loadClasses();});

/* ---------- 班级 ---------- */
async function loadClasses(keep){const {data,error}=await SB.from("classes").select("id,name,prefix,created_at").order("created_at");
  if(error){$("#appMsg").textContent=errText(error);return}
  CLASSES=data||[];const sel=$("#classSel");sel.innerHTML=CLASSES.map(c=>`<option value="${c.id}">${esc(c.name)}（账号 ${esc(c.prefix)}01 起）</option>`).join("");
  $("#noClass").hidden=CLASSES.length>0;
  if(!CLASSES.length){CID=null;$("#statsView").hidden=$("#acctView").hidden=true;return}
  const saved=+localStorage.getItem("xb-teacher-class")||0;CID=keep||(CLASSES.some(c=>c.id===saved)?saved:CLASSES[0].id);sel.value=CID;showView()}
$("#classSel").onchange=()=>{CID=+$("#classSel").value;localStorage.setItem("xb-teacher-class",CID);$("#detail").hidden=true;$("#newList").hidden=true;showView()};
$("#newClass").onsubmit=async e=>{e.preventDefault();const n=$("#newClassName").value.trim();if(!n)return;
  const {data,error}=await SB.rpc("teacher_create_class",{p_name:n});if(error){$("#appMsg").textContent=errText(error);return}
  $("#newClassName").value="";localStorage.setItem("xb-teacher-class",data.id);await loadClasses(data.id);setView("acct")};

let VIEW="stats";
function setView(v){VIEW=v;$("#vStats").setAttribute("aria-pressed",v==="stats");$("#vAcct").setAttribute("aria-pressed",v==="acct");showView()}
$("#vStats").onclick=()=>setView("stats");$("#vAcct").onclick=()=>setView("acct");
function showView(){if(!CID)return;$("#statsView").hidden=VIEW!=="stats";$("#acctView").hidden=VIEW!=="acct";loadOverview()}

/* ---------- 学习情况 ---------- */
async function loadOverview(){const {data,error}=await SB.rpc("teacher_overview",{p_class:CID});if(error){$("#appMsg").textContent=errText(error);return}
  $("#appMsg").textContent="";ROWS=data||[];drawTiles();drawTable();drawAcct()}
function drawTiles(){const n=ROWS.length,today=ROWS.filter(r=>r.today_sec>0).length,week=n?ROWS.reduce((a,r)=>a+r.week_sec,0)/n:0,passed=n?ROWS.reduce((a,r)=>a+r.passed,0)/n:0,tested=ROWS.filter(r=>r.tests>0);
  const avgBest=tested.length?Math.round(tested.reduce((a,r)=>a+r.best_score,0)/tested.length):0;
  $("#tiles").innerHTML=[[n+" 人","学生人数"],[today+" 人","今天来练习"],[dur(Math.round(week)),"近 7 天人均练习"],[passed.toFixed(1)+" 关","人均过关"]].map(([b,s])=>`<div class="tile"><b>${b}</b><span>${s}</span></div>`).join("")}
const COLS=[["username","学生"],["last_seen","状态"],["today_sec","今天"],["week_sec","近 7 天"],["total_sec","累计"],["passed","过关"],["adv","默写过关"],["best_score","测验最高"],["last_score","最近一次"],["tests","测验次数"]];
function drawTable(){const t=$("#tbl");
  if(!ROWS.length){t.innerHTML=`<tbody><tr><td class="empty">这个班还没有学生。到“学生账号”里添加。</td></tr></tbody>`;return}
  const rs=ROWS.slice().sort((a,b)=>{const k=SORT.k;let x=a[k],y=b[k];if(k==="last_seen"){x=x?+new Date(x):0;y=y?+new Date(y):0}return (x>y?1:x<y?-1:0)*SORT.d});
  const maxW=Math.max(1,...ROWS.map(r=>r.week_sec)),maxP=Math.max(1,...ROWS.map(r=>r.passed)),maxS=Math.max(1,...ROWS.map(r=>r.best_score));
  t.innerHTML=`<thead><tr>${COLS.map(([k,l])=>`<th class="sort" data-k="${k}">${l}<span class="arr">${SORT.k===k?(SORT.d>0?"↑":"↓"):""}</span></th>`).join("")}</tr></thead><tbody>`+
    rs.map(r=>`<tr data-id="${r.id}">
      <td class="who"><b>${esc(r.name)}</b><small>${esc(r.username)}</small></td>
      <td>${activity(r)}</td>
      <td>${dur(r.today_sec)}</td>
      <td><div class="bar"><i><em style="width:${r.week_sec/maxW*100}%"></em></i>${dur(r.week_sec)}</div></td>
      <td>${dur(r.total_sec)}</td>
      <td><div class="bar green"><i><em style="width:${r.passed/maxP*100}%"></em></i>${r.passed} 关</div></td>
      <td>${r.adv?r.adv+" 关":"—"}</td>
      <td><div class="bar"><i><em style="width:${r.best_score/maxS*100}%"></em></i>${r.tests?r.best_score+" 分":"—"}</div></td>
      <td>${r.tests?r.last_score+" 分":"—"}</td>
      <td>${r.tests||"—"}</td></tr>`).join("")+"</tbody>";
  t.querySelectorAll("th.sort").forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:k==="username"?1:-1};drawTable()});
  t.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=()=>openDetail(+tr.dataset.id))}

/* ---------- 学生详情 ---------- */
async function openDetail(id){const r=ROWS.find(x=>x.id===id),box=$("#detail");box.hidden=false;box.innerHTML=`<p class="hint">正在载入 ${esc(r.name)} 的数据……</p>`;
  const {data,error}=await SB.rpc("teacher_student_detail",{p_student:id});if(error){box.innerHTML=`<p class="msg err">${esc(errText(error))}</p>`;return}
  box.innerHTML=`<div class="dhead"><h3>${esc(r.name)}<small class="hint" style="font-family:var(--f-body);font-weight:400;margin-left:8px">账号 ${esc(r.username)} · ${ago(r.last_seen)}</small></h3><button class="btn ghost small" id="dClose">收起</button></div>
    <div class="tiles"><div class="tile"><b>${dur(r.week_sec)}</b><span>近 7 天练习</span></div><div class="tile"><b>${dur(r.total_sec)}</b><span>累计练习</span></div><div class="tile"><b>${r.passed} 关</b><span>已过关${r.adv?"（默写 "+r.adv+" 关）":""}</span></div><div class="tile"><b>${r.tests?r.best_score+" 分":"—"}</b><span>测验最高分 · 共 ${r.tests} 次</span></div></div>
    <div class="charts"><div class="chart"><h4>近 30 天每天练习时长（分钟）</h4>${usageChart(data.usage,data.today)}</div><div class="chart"><h4>最近 ${data.tests.length} 次测验得分</h4>${testChart(data.tests)}</div></div>
    <div><h4 style="margin:0 0 8px;font-size:14px;color:#6b4a1f">闯关进度</h4>${progressGrid(data.progress)}</div>`;
  $("#dClose").onclick=()=>{box.hidden=true};box.scrollIntoView({behavior:"smooth",block:"start"})}
function usageChart(usage,today){const W=520,H=190,L=34,B=26,T=12,days=[],map={};usage.forEach(u=>map[u.d]=u.s);
  const end=new Date(today+"T00:00:00");for(let i=29;i>=0;i--){const d=new Date(end);d.setDate(d.getDate()-i);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");days.push({k,m:Math.round((map[k]||0)/60),d})}
  const max=Math.max(10,...days.map(x=>x.m)),step=niceStep(max),top=Math.ceil(max/step)*step,bw=(W-L-6)/30;
  let g="";for(let v=0;v<=top;v+=step){const y=H-B-(v/top)*(H-B-T);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#eadfcb" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a7d6b">${v}</text>`}
  const bars=days.map((x,i)=>{const h=(x.m/top)*(H-B-T),X=L+i*bw+2;return `<rect x="${X}" y="${H-B-h}" width="${bw-4}" height="${Math.max(h,x.m?2:0)}" rx="3" fill="${i===29?"#c4823a":"#e7b46a"}"><title>${x.d.getMonth()+1}月${x.d.getDate()}日：${x.m} 分钟</title></rect>`}).join("");
  const lab=days.map((x,i)=>i%5===4||i===29?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a7d6b">${x.d.getMonth()+1}/${x.d.getDate()}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 30 天练习时长">${g}${bars}${lab}</svg>`}
function testChart(tests){const W=520,H=190,L=40,B=26,T=14;if(!tests.length)return `<p class="hint" style="padding:40px 0;text-align:center">还没有测验记录</p>`;
  const max=Math.max(100,...tests.map(t=>t.s)),step=niceStep(max),top=Math.ceil(max/step)*step,n=tests.length,dx=n>1?(W-L-14)/(n-1):0;
  let g="";for(let v=0;v<=top;v+=step){const y=H-B-(v/top)*(H-B-T);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#eadfcb"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a7d6b">${v}</text>`}
  const pts=tests.map((t,i)=>[L+7+i*dx,H-B-(t.s/top)*(H-B-T)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=n>1?`<path d="${path} L${pts[n-1][0]} ${H-B} L${pts[0][0]} ${H-B}Z" fill="rgba(214,151,74,.15)"/>`:"";
  const dots=tests.map((t,i)=>{const d=new Date(t.t);return `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===n-1?5:3.5}" fill="${i===n-1?"#a8692a":"#d6974a"}" stroke="#fff" stroke-width="1.5"><title>${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}　${t.s} 分（对 ${t.c} 错 ${t.w}）${t.p?"　"+t.p:""}</title></circle>`}).join("");
  const first=new Date(tests[0].t),last=new Date(tests[n-1].t);
  const lab=`<text x="${pts[0][0]}" y="${H-8}" font-size="11" fill="#8a7d6b" text-anchor="start">${first.getMonth()+1}/${first.getDate()}</text>`+(n>1?`<text x="${pts[n-1][0]}" y="${H-8}" font-size="11" fill="#8a7d6b" text-anchor="end">${last.getMonth()+1}/${last.getDate()}</text>`:"")+
    `<text x="${pts[n-1][0]}" y="${pts[n-1][1]-10}" font-size="12" font-weight="700" fill="#a8692a" text-anchor="${n>1?"end":"middle"}">${tests[n-1].s}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="测验得分变化">${g}${area}<path d="${path}" fill="none" stroke="#c4823a" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg>`}
function niceStep(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function progressGrid(progress){if(!progress.length)return `<p class="hint">还没有过关记录。</p>`;
  const units=progress.filter(p=>!progress.some(q=>q.k.startsWith(p.k+"#")));
  const groups={};units.forEach(p=>{const ab=p.k.split(" ")[0];(groups[ab]=groups[ab]||[]).push(p)});
  const key=s=>{const m=s.split(" ")[1]||"";const n=m.match(/\d+/g)||[0,0];return (+n[0])*1000+(+n[1]||0)+(m.includes("#")?+m.split("#")[1]/100:0)};
  const order=Object.keys(groups).sort((a,b)=>(BORDER.indexOf(a)+1||999)-(BORDER.indexOf(b)+1||999));
  return `<div class="legend" style="margin-bottom:10px"><span><i style="background:#f8e2b8"></i>一星</span><span><i style="background:#efbf6b"></i>两星</span><span><i style="background:#d58d2c"></i>三星</span><span><i style="background:#4f5f8c"></i>“默”＝高阶默写过关</span></div><div class="books">`+
    order.map(ab=>{const list=groups[ab].sort((a,b)=>key(a.k)-key(b.k));const s3=list.filter(p=>p.s===3).length;
      return `<div class="book"><h4>${esc(BOOKS[ab]||ab)}<small>${list.length} 关 · 三星 ${s3} 关</small></h4><div class="cells">${list.map(p=>{const lab=p.k.slice(ab.length+1).replace(/#(\d+)/,(m,n)=>"·"+(+n+1));return `<span class="cell s${p.s}${p.a?" adv":""}" title="${esc(p.k)}：${p.s} 星${p.a?"，默写 "+p.a+" 星":""}">${esc(lab)}</span>`}).join("")}</div></div>`}).join("")+`</div>`}

/* ---------- 学生账号 ---------- */
let NEW=[];
$("#addGo").onclick=async()=>{const names=$("#names").value.split(/[\n,，、]+/).map(s=>s.trim()).filter(Boolean),m=$("#addMsg");
  if(!names.length){m.className="msg err";m.textContent="请先写学生名字。";return}
  if(names.length>80){m.className="msg err";m.textContent="一次最多 80 个。";return}
  $("#addGo").disabled=true;const {data,error}=await SB.rpc("teacher_add_students",{p_class:CID,p_names:names});$("#addGo").disabled=false;
  if(error){m.className="msg err";m.textContent=errText(error);return}
  NEW=data||[];m.className="msg ok";m.textContent=`已生成 ${NEW.length} 个账号。`;$("#names").value="";drawNew();loadOverview()};
function drawNew(){$("#newList").hidden=!NEW.length;const cls=(CLASSES.find(c=>c.id===CID)||{}).name||"";
  $("#newTbl").innerHTML=`<thead><tr><th>姓名</th><th>账号</th><th>密码</th></tr></thead><tbody>`+NEW.map(r=>`<tr><td>${esc(r.name)}</td><td class="pw">${esc(r.username)}</td><td class="pw">${esc(r.password)}</td></tr>`).join("")+`</tbody>`;
  $("#newList").dataset.cls=cls}
$("#copyNew").onclick=async()=>{const site=location.href.replace(/teacher\.html.*$/,"");const txt=`心版 · ${(CLASSES.find(c=>c.id===CID)||{}).name||""}\n游戏网址：${site}\n\n`+NEW.map(r=>`${r.name}　账号：${r.username}　密码：${r.password}`).join("\n");
  try{await navigator.clipboard.writeText(txt);$("#copyNew").textContent="已复制"}catch(e){prompt("复制下面的内容",txt)}setTimeout(()=>$("#copyNew").textContent="复制全部",1500)};
$("#printNew").onclick=()=>{document.body.classList.add("printing");window.print();document.body.classList.remove("printing")};
function drawAcct(){const t=$("#acctTbl");if(!ROWS.length){t.innerHTML=`<tbody><tr><td class="empty">还没有学生。</td></tr></tbody>`;return}
  t.innerHTML=`<thead><tr><th>姓名</th><th>账号</th><th>最近上线</th><th></th></tr></thead><tbody>`+ROWS.slice().sort((a,b)=>a.username<b.username?-1:1).map(r=>`<tr data-id="${r.id}" style="cursor:default">
    <td><span class="nm">${esc(r.name)}</span></td><td class="pw">${esc(r.username)}</td><td>${ago(r.last_seen)}</td>
    <td class="ops"><div class="row" style="justify-content:flex-end"><button class="btn ghost small" data-op="pw">重置密码</button><button class="btn ghost small" data-op="rn">改名</button><button class="btn ghost small" data-op="del">删除</button></div></td></tr>`).join("")+`</tbody>`;
  t.querySelectorAll("button[data-op]").forEach(b=>b.onclick=()=>acctOp(+b.closest("tr").dataset.id,b.dataset.op,b))}
async function acctOp(id,op,btn){const r=ROWS.find(x=>x.id===id),cell=btn.closest("td");
  if(op==="pw"){const {data,error}=await SB.rpc("teacher_reset_password",{p_student:id});if(error){$("#appMsg").textContent=errText(error);return}
    cell.innerHTML=`<span>新密码：<b class="pw">${esc(data)}</b>　<span class="hint">请告诉 ${esc(r.name)}，旧密码已失效</span></span>`}
  if(op==="rn"){cell.innerHTML=`<form class="row" style="justify-content:flex-end;flex-wrap:nowrap"><input value="${esc(r.name)}" maxlength="20" style="width:140px"><button class="btn small">保存</button></form>`;
    const f=cell.querySelector("form");f.querySelector("input").focus();f.onsubmit=async e=>{e.preventDefault();const n=f.querySelector("input").value.trim();if(!n)return;
      const {error}=await SB.rpc("teacher_rename_student",{p_student:id,p_name:n});if(error){$("#appMsg").textContent=errText(error);return}loadOverview()}}
  if(op==="del"){cell.innerHTML=`<div class="row" style="justify-content:flex-end"><span class="danger-q">删除 ${esc(r.name)} 和全部学习记录？</span><button class="btn danger small" data-y>确定删除</button><button class="btn ghost small" data-n>取消</button></div>`;
    cell.querySelector("[data-n]").onclick=()=>drawAcct();
    cell.querySelector("[data-y]").onclick=async()=>{const {error}=await SB.rpc("teacher_delete_student",{p_student:id});if(error){$("#appMsg").textContent=errText(error);return}loadOverview()}}}

(async()=>{const {data}=await SB.auth.getSession();if(!data.session){$("#loginBox").hidden=false}})();
</script>
